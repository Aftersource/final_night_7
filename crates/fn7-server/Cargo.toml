[package]
name = "fn7-server"
description = "The Theatre server with Final Night 7 compiled in, recorded by the core; plus fn7-sim (in-process matches in the core recording format, and replay verification)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "fn7-server"
path = "src/main.rs"

[[bin]]
name = "fn7-sim"
path = "src/bin/sim.rs"

[dependencies]
fn7-plugin.workspace = true
fn7-model.workspace = true
fn7-media.workspace = true
fn7-agents.workspace = true
fn7-profile = { path = "../fn7-profile" }
theatre-plugin-api.workspace = true
theatre-llm.workspace = true
theatre-server.workspace = true
theatre-toolkit.workspace = true
theatre-trace.workspace = true
theatre-protocol.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true
clap.workspace = true
reqwest.workspace = true
uuid.workspace = true
serde.workspace = true
ring = "0.17"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
