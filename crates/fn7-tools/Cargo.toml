[package]
name = "fn7-tools"
description = "Final Night 7 tools: agent playtests, JSON Schemas, and the SQL projection of core JSONL recordings."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "fn7-project"
path = "src/bin/project.rs"

[[bin]]
name = "fn7-agents"
path = "src/bin/agents.rs"

[[bin]]
name = "fn7-schemas"
path = "src/bin/schemas.rs"

[[bin]]
name = "fn7-duel-lines"
path = "src/bin/duel_lines.rs"

[[bin]]
name = "fn7-earth-view"
path = "src/bin/earth_view.rs"

[dependencies]
fn7-pantheon.workspace = true
fn7-model = { workspace = true, features = ["schema"] }
fn7-plugin.workspace = true
fn7-earth.workspace = true
schemars.workspace = true
theatre-trace.workspace = true
theatre-protocol.workspace = true
rusqlite.workspace = true
clap.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
reqwest.workspace = true
dotenvy.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
theatre-plugin-api.workspace = true
