[package]
name = "fn7-profile"
description = "Final Night 7 persistent player identity across matches: profiles keyed by normalized display name, demigod identities, match history, image library and time-travel links, in SQLite; backfill from core JSONL recordings; the /api/profiles routes."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "fn7-profile"
path = "src/bin/fn7-profile.rs"

[features]
default = ["http"]
# The /api/profiles routes (axum), merged into fn7-server's router at integration.
http = ["dep:axum", "dep:tokio"]

[dependencies]
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
axum = { version = "0.8", optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
